server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: foundryos-backend
  profiles:
    active: staging

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-staging:5432/foundryos_staging}
    username: ${SPRING_DATASOURCE_USERNAME:foundryos_staging_app}
    password: ${SPRING_DATASOURCE_PASSWORD:StagingSecret2026!SecureKey}
    hikari:
      maximum-pool-size: 25
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

factoryos:
  timezone: ${FOUNDRYOS_TIMEZONE:${FACTORYOS_TIMEZONE:Asia/Kuala_Lumpur}}
  jwt:
    secret: ${JWT_SECRET:staging_strong_jwt_signing_key_secret_256bits_minimum_foundryos_staging_environment_token}
    expiration-minutes: 15
    refresh-expiration-days: 7
  bootstrap:
    enabled: ${FOUNDRYOS_BOOTSTRAP_ENABLED:${FACTORYOS_BOOTSTRAP_ENABLED:true}}
    admin-email: ${FOUNDRYOS_BOOTSTRAP_ADMIN_EMAIL:${FACTORYOS_BOOTSTRAP_ADMIN_EMAIL:admin@staging.foundryos.local}}
    admin-password: ${FOUNDRYOS_BOOTSTRAP_ADMIN_PASSWORD:${FACTORYOS_BOOTSTRAP_ADMIN_PASSWORD:StagingAdmin2026!SecureBootstrap}}
    admin-name: "Staging System Administrator"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://staging.foundryos.local,http://localhost:80,http://localhost}

logging:
  pattern:
    console: '{"time":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"foundryos","traceId":"%X{traceId:-}","reqId":"%X{reqId:-}","user":"%X{userId:-}","logger":"%c{1}","msg":"%replace(%m){''\n'','' ''}"}%n'
